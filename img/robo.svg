<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="gradRobo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <radialGradient id="plasma" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="240" fill="url(#gradRobo)"/>
  <circle cx="200" cy="115" r="70" fill="url(#plasma)" opacity="0.6"/>
  <!-- Cabeça e Armadura Mecha -->
  <g fill="#1e293b" stroke="#38bdf8" stroke-width="3">
    <!-- Ombros / Placas -->
    <path d="M135 155 L160 135 L240 135 L265 155 L280 220 L120 220 Z" fill="#334155"/>
    <!-- Peito / Núcleo de Energia -->
    <circle cx="200" cy="175" r="16" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>
    <!-- Capacete -->
    <polygon points="175,70 225,70 235,115 200,135 165,115" fill="#1e293b"/>
    <!-- Visor Cibernético -->
    <rect x="175" y="90" width="50" height="10" rx="3" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
    <!-- Antenas / Sensores -->
    <line x1="160" y1="65" x2="175" y2="80" stroke="#38bdf8" stroke-width="3"/>
    <line x1="240" y1="65" x2="225" y2="80" stroke="#38bdf8" stroke-width="3"/>
  </g>
  <text x="200" y="215" fill="#38bdf8" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="2">VEKTOR • SENTINELA CYBER</text>
</svg>
