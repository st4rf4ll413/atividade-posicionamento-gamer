<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgNinja" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180e29"/>
      <stop offset="50%" stop-color="#0f091c"/>
      <stop offset="100%" stop-color="#06030a"/>
    </linearGradient>
    <radialGradient id="glowNinja" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
  </defs>
  <rect width="300" height="200" fill="url(#bgNinja)"/>
  <circle cx="150" cy="95" r="75" fill="url(#glowNinja)"/>
  <!-- Crossed Kunai/Katana Blades -->
  <line x1="70" y1="40" x2="230" y2="150" stroke="url(#bladeGrad)" stroke-width="6" stroke-linecap="round"/>
  <line x1="230" y1="40" x2="70" y2="150" stroke="url(#bladeGrad)" stroke-width="6" stroke-linecap="round"/>
  <!-- Ninja Hood / Mask -->
  <path d="M 110 120 C 105 70, 195 70, 190 120 C 185 160, 115 160, 110 120 Z" fill="#1e1336" stroke="#a78bfa" stroke-width="3"/>
  <!-- Mask Shadow -->
  <path d="M 118 90 L 182 90 L 175 125 L 125 125 Z" fill="#0f091c"/>
  <!-- Glowing Eyes -->
  <polygon points="128,102 142,106 130,110" fill="#a78bfa"/>
  <polygon points="172,102 158,106 170,110" fill="#a78bfa"/>
  <ellipse cx="134" cy="106" rx="2" ry="1.5" fill="#f5f3ff"/>
  <ellipse cx="166" cy="106" rx="2" ry="1.5" fill="#f5f3ff"/>
  <!-- Headband Symbol -->
  <rect x="135" y="75" width="30" height="8" rx="3" fill="#6d28d9" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="150" y="180" fill="#c4b5fd" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="2">KAGE • A SOMBRA</text>
</svg>